<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="#0d1117" />
  <rect x="6" y="6" width="88" height="88" rx="22" fill="none" stroke="url(#grad)" stroke-width="4" filter="url(#glow)"/>
  <text x="50" y="62" font-family="'Outfit', sans-serif" font-size="44" font-weight="900" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">?</text>
  <circle cx="28" cy="30" r="4" fill="#06b6d4" />
  <circle cx="72" cy="70" r="4" fill="#ec4899" />
</svg>